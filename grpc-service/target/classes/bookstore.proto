syntax = "proto3";

option java_multiple_files = true;

package bookstore;

message Empty {}

message UserRequest {
  int64 id = 1;
}

message UserResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
}

message BookResponse {
  int64 id = 1;
  string title = 2;
  string author = 3;
  double price = 4;
}

message BookList {
  repeated BookResponse books = 1;
}

message OrderRequest {
  int64 id = 1;
}

message CreateOrderRequestGrpc {
  int64 userId = 1;
  repeated int64 bookIds = 2;
}

message OrderResponse {
  int64 id = 1;
  UserResponse user = 2;
  repeated BookResponse books = 3;
  string createdAt = 4;
}

service BookstoreService {

  rpc GetUser(UserRequest)
      returns (UserResponse);

  rpc GetBooks(Empty)
      returns (BookList);

  rpc GetOrder(OrderRequest)
      returns (OrderResponse);

  rpc CreateOrder(CreateOrderRequestGrpc)
      returns (OrderResponse);
}
